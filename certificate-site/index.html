<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LC MUN • Certificate Studio</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#090b0d;--panel:#12171b;--line:#293038;--text:#f5f2e9;--muted:#8f999f;--gold:#d7b46a;--blue:#1d587d;--ok:#5ec99a;--bad:#e97d7d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1a2c3b,transparent 32%),radial-gradient(circle at 0 100%,#302616,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{padding:24px 18px;border-right:1px solid var(--line);background:#080a0ccc;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;margin-bottom:35px}.crest{width:48px;height:48px;border:1px solid #496b80;border-radius:14px;display:grid;place-items:center;background:#102333;color:#e9ddbf;font:700 20px Georgia}.brand b{display:block;font-size:14px;letter-spacing:.13em}.brand span{font-size:11px;color:var(--muted)}nav{display:grid;gap:7px}nav button{border:0;background:transparent;color:#aeb6ba;text-align:left;padding:12px;border-radius:10px;cursor:pointer}nav button.active,nav button:hover{background:#182127;color:#fff}.side small{position:absolute;bottom:20px;color:#69747a;line-height:1.5}
.main{padding:32px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:25px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.top h1{font:700 42px Georgia;margin:8px 0}.top p{color:var(--muted);max-width:720px}.status{border:1px solid var(--line);border-radius:999px;padding:9px 12px;height:max-content}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:7px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:22px}.step{padding:13px;color:#707a80;border-right:1px solid var(--line);font-size:11px}.step.on{color:#fff;background:#151e24}.step i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#283137;margin-right:7px;font-style:normal}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px}.card{background:#12171bed;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 22px 70px #0005}.head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.head span{color:var(--muted);font-size:11px}.content{padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:15px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0f1417}.stat b{font-size:21px;display:block}.stat span{font-size:9px;color:var(--muted)}
.drop{display:block;border:1px dashed #43515b;border-radius:14px;padding:25px;text-align:center;cursor:pointer;background:#ffffff03}.drop:hover{border-color:#718695}.drop strong{display:block;margin-bottom:6px}.drop small{color:var(--muted)}input[type=file]{display:none}
.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:10px;color:#8e989e;text-transform:uppercase;letter-spacing:.08em}.field input{background:#0d1215;border:1px solid #303940;color:#fff;padding:10px;border-radius:9px}
.row{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #35414a;background:#182027;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--blue);border-color:#2a719e}.btn:disabled{opacity:.4;cursor:not-allowed}.pill{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:999px;background:#20282d;color:#b8c1c5;font-size:10px}
.tablewrap{overflow:auto;max-height:360px;margin-top:15px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid #242b30;text-align:left}.table th{font-size:9px;color:#778188;text-transform:uppercase}.ok{color:var(--ok)}.bad{color:var(--bad)}
.preview{padding:22px;background:#080b0d;min-height:610px;display:grid;place-items:center}.certificate{position:relative;width:min(100%,760px);aspect-ratio:1.414/1;background:#f3ead5;color:#173b54;overflow:hidden;border:7px solid #e4d6b9;box-shadow:0 25px 80px #0009;background-size:cover;background-position:center}.certificate:before{content:"";position:absolute;inset:13px;border:1px solid #a99161}.cert{position:absolute;inset:28px;text-align:center;display:flex;flex-direction:column;align-items:center}.certlogo{width:68px;height:68px;object-fit:contain;border-radius:50%;margin:2px 0}.org{font:700 13px Georgia;letter-spacing:.18em}.title{font:700 31px Georgia;margin:16px 0 5px}.sub{font:italic 13px Georgia;color:#60707b}.name{font:700 30px Georgia;margin:20px 0 4px;border-bottom:1px solid #8e7e5d;padding:0 25px 5px}.role{font:700 13px Georgia;text-transform:uppercase;letter-spacing:.14em}.event{font:13px Georgia;margin-top:8px}.foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:end;font:10px Georgia}.qr{width:70px;height:70px;background:#fff;padding:3px}
.verify{min-height:100vh;display:grid;place-items:center;padding:25px}.vcard{width:min(620px,100%);padding:30px;background:#12171b;border:1px solid var(--line);border-radius:20px;text-align:center}.valid{color:var(--ok);font-weight:700}.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:24px 0;text-align:left}.vgrid div{padding:13px;background:#151b1f}.vgrid small{display:block;color:#7d878d;margin-bottom:4px}.toast{position:fixed;right:20px;bottom:20px;background:#f4f1e9;color:#151a1d;padding:12px 15px;border-radius:10px;box-shadow:0 15px 50px #0008;transform:translateY(100px);transition:.25s;z-index:5}.toast.show{transform:none}
@media(max-width:1000px){.app{display:block}.side{display:none}.main{padding:20px 14px}.grid{grid-template-columns:1fr}.preview{min-height:480px}}@media(max-width:600px){.top{display:block}.top h1{font-size:34px}.stats{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
var S={rows:[],template:"",active:"dashboard",event:"LC MUN",date:"2026",prefix:"LCM26",cols:{name:"Name",committee:"Committee",portfolio:"Portfolio",email:"Email"}};
function $(s){return document.querySelector(s)}function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){$("#toast").textContent=m;$("#toast").classList.add("show");setTimeout(function(){$("#toast").classList.remove("show")},2400)}
function nav(){var a=[["dashboard","Dashboard"],["certificates","Certificates"],["template","Template Studio"],["verification","Verification"]];return '<aside class="side"><div class="brand"><div class="crest">LC</div><div><b>LC MUN</b><span>Certificate Studio</span></div></div><nav>'+a.map(function(x){return '<button class="'+(S.active==x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</nav><small>Private certificate workspace<br>High-volume event delivery</small></aside>'}
function shell(){document.body.innerHTML='<div id="root"></div><div id="toast" class="toast"></div>';$("#root").innerHTML='<div class="app">'+nav()+'<main class="main">'+(S.active=="verification"?verificationPage():dashboard())+'</main></div>';bind()}
function dashboard(){var r=S.rows[0]||{};var name=r[S.cols.name]||"Delegate Name",com=r[S.cols.committee]||"UNGA-DISEC",port=r[S.cols.portfolio]||"Delegate",id=r.__id||S.prefix+"-0001";return '<div class="top"><div><div class="eyebrow">LC MUN • Certificate Operations</div><h1>Certificate Studio</h1><p>Upload your delegate sheet and blank certificate, generate unique QR-backed IDs, then export a delivery-ready manifest.</p></div><div class="status"><span class="dot"></span>Workspace ready</div></div><div class="steps"><div class="step on"><i>1</i>Delegate sheet</div><div class="step on"><i>2</i>Certificate template</div><div class="step on"><i>3</i>Generate</div><div class="step"><i>4</i>Deliver</div></div><div class="grid"><section class="card"><div class="head"><b>Delegate data</b><span>'+S.rows.length+' records</span></div><div class="content"><div class="stats"><div class="stat"><b>'+S.rows.length+'</b><span>DELEGATES</span></div><div class="stat"><b>'+S.rows.filter(function(x){return x.__valid}).length+'</b><span>VALID EMAILS</span></div><div class="stat"><b>'+new Set(S.rows.map(function(x){return x[S.cols.committee]}).filter(Boolean)).size+'</b><span>COMMITTEES</span></div><div class="stat"><b>'+S.rows.length+'</b><span>QR IDS</span></div></div><label class="drop"><input id="excel" type="file" accept=".xlsx,.xls,.csv"><strong>Upload delegate Excel / CSV</strong><small>Automatically detects Name, Committee, Portfolio and Email columns.</small></label>'+(S.rows.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Committee</th><th>Portfolio</th><th>Email</th><th>Status</th></tr></thead><tbody>'+S.rows.slice(0,60).map(function(x){return '<tr><td>'+esc(x[S.cols.name])+'</td><td>'+esc(x[S.cols.committee])+'</td><td>'+esc(x[S.cols.portfolio])+'</td><td>'+esc(x[S.cols.email])+'</td><td class="'+(x.__valid?"ok":"bad")+'">'+(x.__valid?"Ready":"Check")+'</td></tr>'}).join("")+'</tbody></table></div>':"")+'</div></section><section class="card"><div class="head"><b>Certificate setup</b><span>Live</span></div><div class="content"><label class="drop"><input id="template" type="file" accept="image/*"><strong>Upload blank certificate</strong><small>PNG/JPG live preview. Production PDF template rendering is the next engine layer.</small></label><div class="field"><label>Event</label><input id="event" value="'+esc(S.event)+'"></div><div class="field"><label>Certificate prefix</label><input id="prefix" value="'+esc(S.prefix)+'"></div><div class="field"><label>Edition / date</label><input id="date" value="'+esc(S.date)+'"></div><div class="row"><button class="btn primary" onclick="generate()">Sign IDs & QR</button><button class="btn" onclick="downloadAllPDFs()" '+(S.rows.length?"":"disabled")+'>Generate PDFs</button><button class="btn" onclick="deliverAll()" '+(S.rows.length?"":"disabled")+'>Send All</button><button class="btn" onclick="manifest()" '+(S.rows.length?"":"disabled")+'>Manifest</button></div><span class="pill">QR: /verify.html?token={signedToken}</span></div></section></div><div style="height:20px"></div><section class="card"><div class="head"><b>Certificate preview</b><span>First delegate</span></div><div class="preview">'+certificate(name,com,port,id)+'</div></section>'}
function certificate(name,com,port,id){var bg=S.template?'background-image:url("'+S.template+'")':"";return '<div class="certificate" style="'+bg+'"><div class="cert"><img class="certlogo" src="assets/expression-logo.png" onerror="this.style.display=\'none\'"><div class="org">LC MUN</div><div class="title">CERTIFICATE</div><div class="sub">This certificate is proudly presented to</div><div class="name">'+esc(name)+'</div><div class="role">'+esc(port)+'</div><div class="event">for outstanding participation in '+esc(com)+'<br>'+esc(S.event)+'</div><div class="foot"><span>Certificate ID<br><b>'+esc(id)+'</b></span><div id="qr" class="qr"></div><span>'+esc(S.date)+'<br><b>Secretariat</b></span></div></div></div>'}
function bind(){var e=$("#excel"),t=$("#template");if(e)e.onchange=readExcel;if(t)t.onchange=readTemplate;["event","prefix","date"].forEach(function(k){var x=$("#"+k);if(x)x.oninput=function(){S[k]=x.value;drawQR()}});drawQR()}
function drawQR(){var q=$("#qr");if(!q)return;q.innerHTML="";new QRCode(q,{text:S.rows[0]&&S.rows[0].__token?location.origin+"/verify.html?token="+encodeURIComponent(S.rows[0].__token):"LC MUN certificate",width:64,height:64,colorDark:"#173b54",colorLight:"#fff"})}
function readExcel(ev){var f=ev.target.files[0],rd=new FileReader();rd.onload=function(e){try{var wb=XLSX.read(e.target.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:""});if(!rows.length)throw 0;var keys=Object.keys(rows[0]);function find(s){return keys.find(function(k){return k.toLowerCase().replace(/[^a-z]/g,"")==s})||keys.find(function(k){return k.toLowerCase().indexOf(s)>=0})}S.cols.name=find("name")||keys[0];S.cols.committee=find("committee")||keys[1]||keys[0];S.cols.portfolio=find("portfolio")||keys[2]||keys[0];S.cols.email=find("email")||keys[3]||keys[0];S.rows=rows.map(function(r,i){r.__valid=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(String(r[S.cols.email]));r.__id=S.prefix+"-"+String(i+1).padStart(4,"0");return r});toast("Loaded "+S.rows.length+" delegates");shell()}catch(x){toast("Could not read that sheet")}};rd.readAsArrayBuffer(f)}
function readTemplate(ev){var f=ev.target.files[0];if(!f)return;if(!f.type.startsWith("image/")){toast("Upload PNG/JPG for the live preview");return}var rd=new FileReader();rd.onload=function(e){S.template=e.target.result;toast("Certificate template loaded");shell()};rd.readAsDataURL(f)}
async function generate(){if(!S.rows.length){toast("Upload the delegate sheet first");return}toast("Signing certificates…");try{var payload=S.rows.map(function(r,i){return{id:S.prefix+"-"+String(i+1).padStart(4,"0"),name:r[S.cols.name],committee:r[S.cols.committee],portfolio:r[S.cols.portfolio]}});var res=await fetch("/api/issue",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({certificates:payload,event:S.event,edition:S.date})});var d=await res.json();if(!res.ok)throw Error(d.error||"Signing failed");d.certificates.forEach(function(x,i){S.rows[i].__id=x.id;S.rows[i].__token=x.token;S.rows[i].__issuedAt=x.issuedAt});localStorage.setItem("lcmun_certificates",JSON.stringify(S.rows));localStorage.setItem("lcmun_event",JSON.stringify({event:S.event,date:S.date,prefix:S.prefix,cols:S.cols}));toast("Signed "+S.rows.length+" certificates");shell()}catch(e){toast(e.message||"Signing failed")}}
async function renderPDF(r){var stage=document.createElement("div");stage.style.cssText="position:fixed;left:-10000px;top:0;width:1120px;z-index:-1";stage.innerHTML=certificate(r[S.cols.name],r[S.cols.committee],r[S.cols.portfolio],r.__id);document.body.appendChild(stage);var q=stage.querySelector("#qr");if(q){q.innerHTML="";new QRCode(q,{text:location.origin+"/verify.html?token="+encodeURIComponent(r.__token||""),width:64,height:64,colorDark:"#173b54",colorLight:"#fff"})}await new Promise(function(x){setTimeout(x,250)});var canvas=await html2canvas(stage.firstElementChild,{scale:2,useCORS:true,backgroundColor:"#f3ead5"});var pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});pdf.addImage(canvas.toDataURL("image/jpeg",.94),"JPEG",0,0,297,210);var data=pdf.output("datauristring").split(",")[1];stage.remove();return data}
async function downloadAllPDFs(){if(!S.rows.length)return;if(!S.rows[0].__token){toast("Sign the certificates first");return}toast("Generating PDFs…");var zip=new JSZip();for(var i=0;i<S.rows.length;i++){var r=S.rows[i];var b64=await renderPDF(r);zip.file((r.__id||("certificate-"+(i+1)))+".pdf",Uint8Array.from(atob(b64),function(ch){return ch.charCodeAt(0)}))}var blob=await zip.generateAsync({type:"blob"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="LC-MUN-certificates.zip";a.click();toast("PDF ZIP ready")}
async function deliverAll(){if(!S.rows.length)return;if(!S.rows[0].__token){toast("Sign the certificates first");return}var jobs=[];for(var i=0;i<S.rows.length;i++){var r=S.rows[i];if(!r.__valid)continue;toast("Preparing "+(i+1)+"/"+S.rows.length+"…");var b64=await renderPDF(r);jobs.push({email:r[S.cols.email],attachment:{filename:(r.__id||"certificate")+".pdf",content:b64}})}var sent=0;for(var p=0;p<jobs.length;p+=10){var batch=jobs.slice(p,p+10);var res=await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jobs:batch,subject:S.event+" • Your Certificate",html:"<p>Dear Delegate,</p><p>Thank you for participating in <b>"+esc(S.event)+"</b>. Your official certificate is attached.</p><p>Regards,<br>LC MUN Secretariat</p>"})});var d=await res.json();if(!res.ok)throw Error(d.error||"Delivery failed");sent+=d.results.filter(function(x){return x.ok}).length}toast("Delivered "+sent+" certificate emails")}
function manifest(){var out=[["Certificate ID","Name","Committee","Portfolio","Email","Verification URL"]];S.rows.forEach(function(r){out.push([r.__id,r[S.cols.name],r[S.cols.committee],r[S.cols.portfolio],r[S.cols.email],r.__token?location.origin+"/verify.html?token="+encodeURIComponent(r.__token):""])});var csv=out.map(function(a){return a.map(function(v){return '"'+String(v==null?"":v).replaceAll('"','""')+'"'}).join(",")}).join("\\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="LC-MUN-certificate-manifest.csv";a.click()}
function verificationPage(){var id=new URLSearchParams(location.search).get("id"),data=JSON.parse(localStorage.getItem("lcmun_certificates")||"[]"),ev=JSON.parse(localStorage.getItem("lcmun_event")||"{}"),r=data.find(function(x){return x.__id==id});if(!r)return '<div class="verify"><div class="vcard"><div class="eyebrow">LC MUN • Digital Verification</div><h1 style="font:700 35px Georgia">Certificate Not Found</h1><p style="color:#9aa3a8">No certificate with this verification ID exists in this browser workspace.</p></div></div>';var c=ev.cols||S.cols;return '<div class="verify"><div class="vcard"><div class="eyebrow">LC MUN • Digital Verification</div><h1 style="font:700 35px Georgia">Certificate Authentic</h1><div class="valid">✓ VALID CERTIFICATE</div><div class="vgrid"><div><small>Certificate ID</small><b>'+esc(r.__id)+'</b></div><div><small>Event</small><b>'+esc(ev.event||"LC MUN")+'</b></div><div><small>Name</small><b>'+esc(r[c.name])+'</b></div><div><small>Committee</small><b>'+esc(r[c.committee])+'</b></div><div><small>Portfolio</small><b>'+esc(r[c.portfolio])+'</b></div><div><small>Issued</small><b>'+esc(ev.date||"")+'</b></div></div><p style="color:#879197">The certificate ID matches the LC MUN certificate registry stored by this workspace.</p></div></div>'}
function go(k){S.active=k;shell()}window.go=go;window.generate=generate;window.manifest=manifest;shell();
</script></body></html>
