<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC MUN • Certificate Verification</title><style>:root{--bg:#090b0d;--line:#293038;--muted:#9aa3a8;--gold:#d7b46a;--ok:#5ec99a;--bad:#e97d7d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 50% 0,#1a2c3b,transparent 38%),var(--bg);color:#f5f2e9;font-family:Inter,system-ui,sans-serif}.card{width:min(620px,100%);padding:34px;background:#12171b;border:1px solid var(--line);border-radius:22px;text-align:center;box-shadow:0 25px 80px #0008}.ey{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:25px 0;text-align:left}.grid div{padding:14px;background:#151b1f}.grid small{display:block;color:var(--muted);margin-bottom:5px}.mark{width:58px;height:58px;border:1px solid #52758a;border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;background:#102333;color:#e9ddbf;font:700 22px Georgia}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div id="root"><div class="card"><div class="mark">LC</div><div class="ey">LC MUN • Digital Verification</div><h1 style="font:700 30px Georgia">Checking certificate…</h1></div></div><script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}}[c])}
(async function(){const token=new URLSearchParams(location.search).get("token");if(!token){show(false,"No verification token was supplied.");return}try{const r=await fetch("/api/verify?token="+encodeURIComponent(token));const d=await r.json();if(!d.valid){show(false,"This certificate could not be authenticated.");return}const c=d.certificate;document.getElementById("root").innerHTML='<div class="card"><div class="mark">LC</div><div class="ey">LC MUN • Digital Verification</div><h1 style="font:700 35px Georgia;margin:12px 0">Certificate Authentic</h1><div class="ok">✓ VALID CERTIFICATE</div><div class="grid"><div><small>Certificate ID</small><b>'+esc(c.id)+'</b></div><div><small>Event</small><b>'+esc(c.event)+'</b></div><div><small>Name</small><b>'+esc(c.name)+'</b></div><div><small>Committee</small><b>'+esc(c.committee)+'</b></div><div><small>Portfolio</small><b>'+esc(c.portfolio)+'</b></div><div><small>Issued</small><b>'+esc(c.edition)+'</b></div></div><p style="color:#879197">This certificate was digitally signed by the LC MUN issuing system. The verification token has not been altered.</p></div>'}catch(e){show(false,"The verification service is unavailable right now.")}})();
function show(ok,msg){document.getElementById("root").innerHTML='<div class="card"><div class="mark">LC</div><div class="ey">LC MUN • Digital Verification</div><h1 style="font:700 35px Georgia">'+(ok?"Certificate Authentic":"Certificate Not Verified")+'</h1><div class="'+(ok?"ok":"bad")+'">'+(ok?"✓ VALID CERTIFICATE":"✕ INVALID CERTIFICATE")+'</div><p style="color:#9aa3a8">'+esc(msg)+'</p></div>'}
</script></body></html>
