<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC MUN • Certificate Verification</title><style>:root{--bg:#090b0d;--line:#293038;--muted:#9aa3a8;--gold:#d7b46a;--ok:#5ec99a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 50% 0,#1a2c3b,transparent 38%),var(--bg);color:#f5f2e9;font-family:Inter,system-ui,sans-serif}.card{width:min(620px,100%);padding:34px;background:#12171b;border:1px solid var(--line);border-radius:22px;text-align:center;box-shadow:0 25px 80px #0008}.ey{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.ok{color:var(--ok);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:25px 0;text-align:left}.grid div{padding:14px;background:#151b1f}.grid small{display:block;color:var(--muted);margin-bottom:5px}.mark{width:58px;height:58px;border:1px solid #52758a;border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;background:#102333;color:#e9ddbf;font:700 22px Georgia}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script>function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}var id=new URLSearchParams(location.search).get("id"),rows=JSON.parse(localStorage.getItem("lcmun_certificates")||"[]"),ev=JSON.parse(localStorage.getItem("lcmun_event")||"{}"),r=rows.find(function(x){return x.__id===id});if(!r){document.getElementById("root").innerHTML='<div class="card"><div class="mark">LC</div><div class="ey">LC MUN • Digital Verification</div><h1 style="font:700 34px Georgia">Certificate Not Found</h1><p style="color:#9aa3a8">The verification ID <b>'+esc(id||"—")+'</b> is not registered in this workspace.</p></div>'}else{var c=ev.cols||{name:"Name",committee:"Committee",portfolio:"Portfolio"};document.getElementById("root").innerHTML='<div class="card"><div class="mark">LC</div><div class="ey">LC MUN • Digital Verification</div><h1 style="font:700 34px Georgia;margin:12px 0">Certificate Authentic</h1><div class="ok">✓ VALID CERTIFICATE</div><div class="grid"><div><small>Certificate ID</small><b>'+esc(r.__id)+'</b></div><div><small>Event</small><b>'+esc(ev.event||"LC MUN")+'</b></div><div><small>Name</small><b>'+esc(r[c.name])+'</b></div><div><small>Committee</small><b>'+esc(r[c.committee])+'</b></div><div><small>Portfolio</small><b>'+esc(r[c.portfolio])+'</b></div><div><small>Issued</small><b>'+esc(ev.date||"")+'</b></div></div><p style="color:#879197">This certificate ID matches the LC MUN certificate registry stored by the issuing workspace.</p></div>'}</script></body></html>
